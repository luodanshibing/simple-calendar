<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Simple Calendar · 月（含周号列）/ 年</title>
<style>
  .frame {
    --background-primary: #ffffff;
    --background-secondary: #f6f6f6;
    --background-modifier-border: #e0e0e0;
    --background-modifier-hover: #ececec;
    --text-normal: #2e3338;
    --text-muted: #888888;
    --text-faint: #aaaaaa;
    --interactive-accent: #7f6df2;
    --text-on-accent: #ffffff;
    --font-interface: system-ui, "Microsoft YaHei", sans-serif;
  }
  body { margin: 0; padding: 20px; background: #2b2b2b; font-family: system-ui, "Microsoft YaHei", sans-serif; }
  .cols { display: flex; gap: 18px; align-items: flex-start; }
  .col { width: 330px; }
  .label { color: #e5e5e5; font-size: 13px; margin: 0 0 8px; }
  .label b { color: #fff; }
  .label code { color: #a5b4fc; }
  .frame {
    box-sizing: border-box; width: 330px; height: 430px; overflow: hidden;
    background: var(--background-primary);
    border: 1px solid #444; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    font-family: var(--font-interface);
    color: var(--text-normal);
  }
</style>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="cols">

  <div class="col">
    <div class="label"><b>① 月视图（周号并入）</b> · 箭头在月/年两侧，「今天」独立在标题行 <code>月</code></div>
    <div class="frame">
      <div class="simple-calendar">
        <div class="sc-header">
          <div class="sc-title-row">
            <div class="sc-titles">
              <button class="sc-title">10月</button>
              <button class="sc-title sc-title-year">2026</button>
            </div>
            <button class="sc-today is-off">今天</button>
          </div>
          <div class="sc-nav-row">
            <button class="sc-nav">‹</button>
            <div class="sc-tabs">
              <button class="sc-tab is-active">月</button>
              <button class="sc-tab">年</button>
            </div>
            <button class="sc-nav">›</button>
          </div>
        </div>
        <div class="sc-body"><div class="sc-grid sc-grid-month has-week" id="month-grid"></div></div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="label"><b>② 年视图</b> · 点月份名回月视图，点格子进当天 <code>年</code></div>
    <div class="frame">
      <div class="simple-calendar">
        <div class="sc-header">
          <div class="sc-title-row">
            <div class="sc-titles"><button class="sc-title">2026</button></div>
            <button class="sc-today">今天</button>
          </div>
          <div class="sc-nav-row">
            <button class="sc-nav">‹</button>
            <div class="sc-tabs">
              <button class="sc-tab">月</button>
              <button class="sc-tab is-active">年</button>
            </div>
            <button class="sc-nav">›</button>
          </div>
        </div>
        <div class="sc-body"><div class="sc-year" id="year-grid"></div></div>
      </div>
    </div>
  </div>

</div>

<script>
  // 仅用于预览页：按插件同款规则生成月网格（含周号）与年网格
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const START = 1;

  function startOfWeek(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const shift = (x.getDay() - START + 7) % 7;
    x.setDate(x.getDate() - shift);
    return x;
  }
  function addDays(d, n) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  }
  function key(d) {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function isoWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  }
  function grid(year, month) {
    const first = startOfWeek(new Date(year, month, 1));
    const cells = [];
    for (let i = 0; i < 42; i += 1) {
      const d = addDays(first, i);
      cells.push({ d: d, inMonth: d.getMonth() === month });
    }
    return cells;
  }

  const HAVE = new Set(['2026-09-29','2026-10-02','2026-10-05','2026-10-06','2026-10-08','2026-10-10','2026-10-14','2026-10-20','2026-10-21']);
  const HAVE_WEEK = new Set(['2026-10-05','2026-09-28']);
  const TODAY = '2026-10-11';

  const mg = document.getElementById('month-grid');
  const wHead = document.createElement('div');
  wHead.className = 'sc-dow sc-dow-week';
  wHead.textContent = 'W';
  mg.appendChild(wHead);
  for (let i = 0; i < 7; i += 1) {
    const el = document.createElement('div');
    el.className = 'sc-dow';
    el.textContent = WD[(START + i) % 7];
    mg.appendChild(el);
  }
  const cells = grid(2026, 9);
  for (let r = 0; r < 6; r += 1) {
    const row = cells.slice(r * 7, r * 7 + 7);
    const wk = document.createElement('div');
    wk.className = 'sc-wnum' + (HAVE_WEEK.has(key(row[0].d)) ? ' has-note' : '');
    wk.textContent = String(isoWeek(row[0].d)).padStart(2, '0');
    mg.appendChild(wk);
    for (const c of row) {
      const k = key(c.d);
      const el = document.createElement('div');
      el.className = 'sc-cell' + (c.inMonth ? '' : ' is-out') + (k === TODAY ? ' is-today' : '');
      const num = document.createElement('div');
      num.className = 'sc-daynum';
      num.textContent = c.d.getDate();
      el.appendChild(num);
      const slot = document.createElement('div');
      slot.className = 'sc-dot-slot' + (HAVE.has(k) ? ' has-note' : '');
      el.appendChild(slot);
      mg.appendChild(el);
    }
  }

  const yg = document.getElementById('year-grid');
  for (let m = 0; m < 12; m += 1) {
    const box = document.createElement('div');
    box.className = 'sc-mini';
    const t = document.createElement('div');
    t.className = 'sc-mini-title';
    t.textContent = MONTHS[m];
    box.appendChild(t);
    const g = document.createElement('div');
    g.className = 'sc-mini-grid';
    for (const c of grid(2026, m)) {
      const k = key(c.d);
      const cell = document.createElement('div');
      cell.className = 'sc-mini-cell' + (c.inMonth ? '' : ' is-out') + (k === TODAY ? ' is-today' : '');
      const slot = document.createElement('div');
      slot.className = 'sc-dot-slot' + (HAVE.has(k) ? ' has-note' : '');
      cell.appendChild(slot);
      g.appendChild(cell);
    }
    box.appendChild(g);
    yg.appendChild(box);
  }
</script>
</body>
</html>
